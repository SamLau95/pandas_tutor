[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandas_tutor"
dynamic = ["version"]
description = "A visual debugger for pandas"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=1.3",
    "mypy-extensions==0.4.3",
    "typing-extensions>=4.1,<5.0",
]

[project.urls]
Homepage = "https://github.com/SamLau95/pandas_tutor"
Repository = "https://github.com/SamLau95/pandas_tutor"
Issues = "https://github.com/SamLau95/pandas_tutor/issues"

[tool.setuptools]
packages = ["pandas_tutor"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.golden"]

[tool.setuptools.dynamic]
version = {attr = "pandas_tutor.__version__.__version__"}

[tool.black]
line-length = 80
extend-exclude = '''
/pandas_tutor/tests/.*\.py
'''

[tool.pyright]
include = ["pandas_tutor"]
exclude = [
    "**/__pycache__",
    "pandas_tutor/tests/**/*.py"
]
